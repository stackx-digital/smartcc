  <!-- Card dots -->
  <circle cx="50" cy="130" r="4" fill="white" opacity="0.6"/>
  <circle cx="62" cy="130" r="4" fill="white" opacity="0.6"/>
  <circle cx="74" cy="130" r="4" fill="white" opacity="0.6"/>
  <circle cx="86" cy="130" r="4" fill="white" opacity="0.6"/>
