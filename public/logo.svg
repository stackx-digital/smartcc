<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="#1D4ED8"/>

  <!-- Credit card body -->
  <rect x="34" y="62" width="132" height="84" rx="12" fill="white" opacity="0.15"/>
  <rect x="34" y="62" width="132" height="84" rx="12" stroke="white" stroke-width="3" fill="none"/>

  <!-- Card stripe -->
  <rect x="34" y="88" width="132" height="18" fill="white" opacity="0.25"/>

  <!-- Chip -->
  <rect x="50" y="72" width="22" height="16" rx="3" fill="#FCD34D"/>
  <line x1="55" y1="72" x2="55" y2="88" stroke="#F59E0B" stroke-width="1.5"/>
  <line x1="61" y1="72" x2="61" y2="88" stroke="#F59E0B" stroke-width="1.5"/>
  <line x1="67" y1="72" x2="67" y2="88" stroke="#F59E0B" stroke-width="1.5"/>
  <line x1="50" y1="78" x2="72" y2="78" stroke="#F59E0B" stroke-width="1.5"/>
  <line x1="50" y1="82" x2="72" y2="82" stroke="#F59E0B" stroke-width="1.5"/>

  <!-- Upward arrow (smart / optimize) -->
